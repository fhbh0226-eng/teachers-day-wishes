<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教师节快乐｜一份特别的祝福</title>
<meta name="description" content="每次打开，都能收到一句不一样的教师节祝福。">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Songti SC","Microsoft YaHei",serif}
.scene{min-height:100svh;overflow:hidden;position:relative;display:grid;place-items:center;padding:38px 18px 28px;color:#633b32;background:radial-gradient(circle at 15% 15%,#ffffffd1,transparent 28%),radial-gradient(circle at 86% 82%,#ffdb975e,transparent 32%),linear-gradient(145deg,#fff9ed,#fcebd5 52%,#f8dfbe)}
.scene:before,.scene:after{content:"";position:absolute;border-radius:50%;opacity:.6}.scene:before{width:260px;height:260px;left:-130px;bottom:-80px;background:#efb574}.scene:after{width:210px;height:210px;right:-100px;top:-75px;background:#f7c770}
.rays{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 68px,#ffffff2e 69px 70px)}
.card{width:min(430px,100%);min-height:650px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 30px 34px;border:1px solid #9e623c38;border-radius:32px;background:#fffdf7e6;box-shadow:0 28px 70px #74442233,inset 0 0 0 7px #ffffff73;backdrop-filter:blur(14px)}
.card:before{content:"";position:absolute;inset:13px;border:1px solid #c6894338;border-radius:23px;pointer-events:none}
.eyebrow{margin:0;color:#b06d45;font-size:12px;font-weight:700;letter-spacing:.28em}.flower{margin:19px 0 9px;font-size:54px;filter:drop-shadow(0 8px 7px #7749192e);animation:sway 3.2s ease-in-out infinite;transform-origin:bottom}
h1{margin:0;color:#7b4035;font-size:clamp(34px,10vw,46px);letter-spacing:.08em}.sub{margin:11px 0 25px;color:#a87967;font-size:14px;letter-spacing:.06em}
.wbox{position:relative;width:100%;min-height:180px;display:grid;place-items:center;padding:30px 22px;border-radius:22px;background:linear-gradient(135deg,#fff6dbe6,#fdebcfb8);border:1px solid #ce92532e;opacity:0;transform:translateY(12px) scale(.98);transition:.7s}
.wbox.show{opacity:1;transform:none}.wish{margin:0;color:#744b3f;font-size:19px;line-height:1.9;font-weight:600;letter-spacing:.055em;animation:word .7s ease both}
.q{position:absolute;left:13px;top:2px;color:#be7c4a59;font:54px Georgia}.q.end{left:auto;right:13px;top:auto;bottom:-20px}
button{margin-top:26px;border:0;border-radius:99px;padding:13px 23px;color:#fffaf2;background:linear-gradient(135deg,#a85b43,#c87e52);box-shadow:0 10px 24px #9b4e363f;font-size:14px;font-weight:700;letter-spacing:.08em;cursor:pointer}button:active{transform:scale(.96)}
.sig{width:100%;margin-top:auto;padding-top:29px;display:flex;align-items:center;gap:11px;color:#b67b58}.sig i{height:1px;flex:1;background:linear-gradient(90deg,transparent,#b67b5866)}.sig i:last-child{transform:rotate(180deg)}.sig p{margin:0;font-size:13px;letter-spacing:.2em}
.corner{position:absolute;top:25px;color:#b9714073;font-size:18px}.left{left:27px}.right{right:27px}.hint{position:absolute;z-index:3;bottom:10px;margin:0;color:#6e45359e;font-size:11px;letter-spacing:.08em}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}.petals i{position:absolute;top:-30px;z-index:1;border-radius:80% 0 80% 0;background:linear-gradient(135deg,#f3ba6c,#d97858);opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(70px,112vh) rotate(540deg)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}@keyframes word{from{opacity:0;filter:blur(5px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
@media(max-height:720px){.card{min-height:600px;padding-top:31px}.flower{margin-top:11px}.wbox{min-height:160px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body><main class="scene"><div class="rays"></div><div class="petals" id="petals"></div>
<section class="card"><div class="corner left">✦</div><div class="corner right">✦</div><p class="eyebrow">九月 · 感恩有您</p><div class="flower">🌻</div><h1>亲爱的老师</h1><p class="sub">请收下这份藏在秋日里的祝福</p>
<div class="wbox" id="box"><span class="q">“</span><p class="wish" id="wish"></p><span class="q end">”</span></div>
<button id="again">再收一份祝福　✦</button><div class="sig"><i></i><p>教师节快乐</p><i></i></div></section>
<p class="hint">每次打开，都会遇见一句新的心意</p></main>
<script>
const wishes=["一支粉笔，两袖微尘；三尺讲台，四季耕耘。老师，您辛苦了！","愿您的每一天都像今天一样，被鲜花、掌声和温暖围绕。","感谢您把平凡的日子，变成我们闪闪发光的成长时光。","山高水长有时尽，唯有师恩日月长。祝您教师节快乐！","您写下的是知识，擦去的是无知，种下的是希望。谢谢您！","愿清风送去我们的敬意，愿星光照亮您的每一个好梦。","因为您的耐心与温柔，我们才有勇气走向更远的地方。","桃李不言，下自成蹊。愿您岁岁欢愉，事事顺意！","教诲如春风，师恩似海深。祝亲爱的老师平安喜乐！","愿您眼里有光、心中有爱，生活里永远有花开。","成长路上有您指引，是我们最珍贵、最温暖的幸运。","您用知识点亮梦想，我们用真心祝您节日快乐！"];
let last=-1;const el=document.getElementById("wish"),box=document.getElementById("box");
function show(){let n;do{n=Math.floor(Math.random()*wishes.length)}while(n===last);last=n;box.classList.remove("show");void box.offsetWidth;el.textContent=wishes[n];box.classList.add("show")}
document.getElementById("again").onclick=show;setTimeout(show,650);
const p=document.getElementById("petals");for(let i=0;i<18;i++){let x=document.createElement("i");let s=10+i%4*4;x.style.cssText=`left:${(i*37+9)%100}%;width:${s}px;height:${s}px;animation-delay:${i%7*-1.1}s;animation-duration:${7+i%5}s`;p.appendChild(x)}
</script></body></html>
