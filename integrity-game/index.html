<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清风正途·廉洁人生棋</title><style>:root{--g:#155c4c;--r:#963129;--y:#c79a3d}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#173c33;font-family:"Songti SC",serif;background:radial-gradient(circle at 82% 1%,#fff1b9 0 7%,transparent 27%),linear-gradient(145deg,#e8f0e5,#f8efd9)}main{max-width:720px;margin:auto;padding:20px 12px}.box{background:#fffaf0ee;border:1px solid #d8b96e;border-radius:26px;padding:25px 18px;box-shadow:0 18px 50px #274d4026}h1{text-align:center;color:var(--g);font-size:clamp(28px,7vw,48px);margin:0}.sub,.foot{text-align:center;color:#756e61}.bar{display:flex;gap:6px;margin:22px 0}.bar i{height:7px;flex:1;border-radius:8px;background:#ded5c1}.bar .on{background:linear-gradient(90deg,var(--g),var(--y))}.icon{width:80px;height:80px;margin:auto;display:grid;place-items:center;border:2px solid var(--y);border-radius:50%;background:#e6f1e8;font-size:40px}.tag{text-align:center;color:var(--r);font-weight:bold;letter-spacing:.18em;margin-top:10px}.q{text-align:center;font-size:20px;line-height:1.7;margin:12px auto 20px}.choices{display:grid;gap:11px}.choice{padding:14px;border:1px solid #b7cbbb;border-radius:15px;background:#fffdf7;color:#173c33;font:inherit;font-size:16px;text-align:left;cursor:pointer}.choice b{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:8px;border-radius:50%;background:var(--g);color:white}.result{text-align:center}.score{font-size:60px;color:var(--g);font-weight:bold}.card{margin:18px 0;padding:20px;border:1px solid var(--y);border-radius:17px;background:#f7ecd2}.motto{font-size:21px;color:var(--r);font-weight:bold}.again{border:0;border-radius:99px;padding:13px 24px;background:var(--g);color:white;font:inherit;font-weight:bold}.foot{font-size:13px;margin-top:20px}</style></head><body><main><section class="box"><h1>清风正途·廉洁人生棋</h1><p class="sub">一步一选择，一念守初心</p><div class="bar" id="bar"></div><div id="game"></div><p class="foot">原创廉洁文化互动体验</p></section></main><script>const S=[['坚守初心','🪷','负责物资采购时，熟人请你“照顾一下”，并暗示事后表示感谢。你会怎么做？',[['坚持公开透明，并主动回避利益冲突',2],['觉得价格差不多，可以帮忙',0],['含糊回应，结果出来后再决定',1]]],['制度底线','⚖️','发现一笔报销材料不完整，但同事说“以前都是这样办的”。你会怎么做？',[['按流程退回补充，并说明制度依据',2],['碍于情面先通过，下次再提醒',0],['暂时搁置，不作处理',1]]],['群众监督','👁️','有人对项目评选结果提出质疑，怎样处理更合适？',[['核查全过程，公开依据并接受监督',2],['认为对方不理解，不予回应',0],['只私下解释，不留下处理记录',1]]],['家风提醒','🏡','亲友希望借用你的职务影响力解决私人问题。你会怎么做？',[['明确拒绝，并约定不越纪律红线',2],['事情不大，可以悄悄帮忙',0],['让别人出面，自己不直接参与',1]]],['自省明镜','🪞','面对一次看似无人知晓的小利益，真正的底线是什么？',[['慎独慎微，无人监督也守原则',2],['只要不会被发现就可以接受',0],['先接受，以后再补救',1]]]];let n=0,s=0;const G=document.querySelector('#game'),B=document.querySelector('#bar');function R(){B.innerHTML=S.map((_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('');if(n>=S.length)return Z();let x=S[n];G.innerHTML=`<div><div class="icon">${x[1]}</div><div class="tag">${x[0]}</div><div class="q">${x[2]}</div><div class="choices">${x[3].map((a,i)=>`<button class="choice" onclick="P(${a[1]})"><b>${String.fromCharCode(65+i)}</b>${a[0]}</button>`).join('')}</div></div>`}function P(v){s+=v;n++;R()}function Z(){let x=s>=9?['清风守正者','心有所畏，言有所戒，行有所止。']:s>=6?['初心践行者','守住小节，常照明镜，让选择经得起检验。']:['廉心成长者','知边界、明底线、守初心。'];G.innerHTML=`<div class="result"><h2>${x[0]}</h2><div class="score">${s}<small style="font-size:16px"> / 10</small></div><div class="card"><div class="motto">${x[1]}</div><p>愿你在每一次选择中守住初心，在每一步前行中保持清醒。</p></div><button class="again" onclick="n=0;s=0;R()">再走一次清风正途</button></div>`}R()</script></body></html>
